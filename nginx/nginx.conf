worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Aligné avec MAX_UPLOAD_SIZE_MB du backend (15 Mo par défaut) + marge
    # pour les en-têtes multipart — à garder cohérent si cette variable change.
    client_max_body_size 20M;

    # Connection: upgrade uniquement pour les vraies requêtes de bascule de
    # protocole (WebSocket) ; sinon "close", pour ne jamais interférer avec
    # le keep-alive des requêtes HTTP normales.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # FastAPI : toutes les routes de l'application sont déjà préfixées par
        # /api (voir backend/app/main.py) — proxy_pass sans chemin final
        # transmet l'URI d'origine telle quelle (/api/health reste /api/health
        # côté backend), donc aucun doublon /api/api/... n'est introduit.
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Next.js (tout le reste : pages, assets statiques, etc.)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
