services:
  db:
    image: postgres:16
    container_name: itsupport_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Le port PostgreSQL n'est plus publié sur l'hôte : la base n'est joignable
    # que depuis le réseau Docker interne (service `backend`). Pour un accès
    # local de développement (psql, DBeaver...), voir docker-compose.override.yml.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - itsupport_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsupport_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - uploads_data:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             if [ \"$$ENVIRONMENT\" != \"production\" ] && [ \"$$SEED_ON_STARTUP\" != \"false\" ]; then
               echo '[seed] environnement non-production : injection des donnees de demonstration' &&
               python -m app.seed;
             else
               echo '[seed] production ou SEED_ON_STARTUP=false : seed ignore';
             fi &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - itsupport_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: itsupport_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:3000"
    networks:
      - itsupport_network

volumes:
  postgres_data:
    name: itsupport_postgres_data
  uploads_data:
    name: itsupport_uploads_data

networks:
  itsupport_network:
    name: itsupport_network
    driver: bridge
